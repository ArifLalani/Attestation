<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 — Fidèle, affinée · Opinion System</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../A-7/assets/os-figma.css">
<link rel="stylesheet" href="../figma-profile/assets/profile.css">
<link rel="stylesheet" href="assets/jam.css">
<style>
  /* Polish pass only — same structure as the Figma, tighter rhythm, an
     elevated verdict (+ histogram), a sticky condensed header that appears
     once the hero scrolls away, and a sticky tab bar while browsing avis. */
  .sticky-id{position:sticky;top:0;z-index:15;background:#fff;border-bottom:1px solid var(--os-border);
    display:flex;align-items:center;gap:10px;padding:10px 16px;transform:translateY(-100%);transition:transform .2s;box-shadow:0 2px 10px rgba(4,27,68,.06)}
  .sticky-id.is-visible{transform:translateY(0)}
  .sticky-id .logo-tile{width:34px;height:34px;border-radius:8px;font-size:13px}
  .sticky-id .si-name{font:600 14px/1.2 Poppins,sans-serif;color:var(--os-navy);flex:1 0 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sticky-id .si-score{font:700 14px/1 Poppins,sans-serif;color:var(--os-green-text);white-space:nowrap}
  .tabbar{position:sticky;top:0;z-index:12}
  .verdict-card{margin:0 16px}
  .histo-card{background:#fff;border-radius:var(--r-card);box-shadow:var(--e1);padding:16px;margin:12px 16px 0}
  .histo-card .t-sub2{margin:0 0 10px;color:var(--os-navy)}
  .section-wrap{background:#fff;padding:20px 16px;margin-top:8px}
  .section-wrap + .section-wrap{margin-top:1px}
</style>
</head>
<body>
<div class="harness"><span>01 · FIDÈLE, AFFINÉE — même structure que votre Figma, polish de rythme/hiérarchie</span><a href="index.html">← Jam</a></div>

<div class="sticky-id" id="stickyId"></div>
<div id="app"></div>

<script src="../figma-profile/assets/fixture.js"></script>
<script src="../figma-profile/assets/sections.js"></script>
<script src="../figma-profile/assets/interactions.js"></script>
<script>
(function () {
  var S = window.OSSections, f = window.OS_FIXTURE;
  var config = { responsePlacement: "detail" };

  var html =
    S.renderBanner(f) +
    S.renderHeroPhoto() +
    '<div class="business-card">' + S.renderBusinessIdentity(f) + '<div style="margin-top:16px">' + S.renderDashboard(f) + "</div></div>" +
    '<div class="section" style="padding-top:20px">' + S.renderVerdict(f) + "</div>" +
    '<div class="histo-card"><p class="t-sub2">Répartition des ' + f.ratings.verified.count + " avis contrôlés</p>" + S.renderHistogram(f) + "</div>" +
    '<div style="margin-top:20px">' + S.renderReviewTabsBlock(f, { showHighlights: true }) + "</div>" +
    '<div class="section-wrap">' + S.renderLocations(f) + "</div>" +
    S.renderQualityApproach(f) +
    '<div class="section-wrap"><p class="section-title">Notre équipe</p><p class="section-sub">Les personnes derrière vos dossiers</p></div>' +
    S.renderTeam(f) +
    '<div class="section-wrap">' + S.renderCertificate(f) + "</div>" +
    '<div class="section-wrap"><p class="section-title">Questions fréquentes</p>' + S.renderFAQ(f) + "</div>" +
    '<div class="section-wrap">' + S.renderListMyBusiness(f) + "</div>" +
    S.renderLegalBlock(f) +
    S.renderFooter(f);

  document.getElementById("app").innerHTML = '<div class="viewport">' + html + "</div>";
  OSInteractions.wireAll(document.getElementById("app"), f, config);

  // Sticky condensed identity strip
  var stickyEl = document.getElementById("stickyId");
  stickyEl.innerHTML =
    '<div class="logo-tile" style="background:rgba(44,149,255,.08)">' + f.business.logoInitials + "</div>" +
    '<span class="si-name">' + S.esc(f.business.name) + "</span>" +
    '<span class="si-score">' + f.ratings.verified.rating.toFixed(1).replace(".", ",") + "/5</span>";
  var heroEl = document.querySelector(".hero-photo");
  window.addEventListener("scroll", function () {
    stickyEl.classList.toggle("is-visible", window.scrollY > (heroEl.offsetTop + heroEl.offsetHeight));
  });
})();
</script>
</body>
</html>
