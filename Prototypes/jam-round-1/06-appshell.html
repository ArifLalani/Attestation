<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 — App Shell · Opinion System</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../A-7/assets/os-figma.css">
<link rel="stylesheet" href="../figma-profile/assets/profile.css">
<link rel="stylesheet" href="assets/jam.css">
<style>
  /* The surprise: stop treating this as one long scroll. Treat it as an
     app with four destinations — Aperçu / Avis / Agences / Infos — behind
     a bottom tab bar (native-app pattern). Desktop promotes the same bar
     to a persistent left sidebar instead of a wider single column. */
  .app-header{position:sticky;top:0;z-index:15;background:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--os-border)}
  .app-header .logo-tile{width:38px;height:38px;border-radius:8px;font-size:14px}
  .app-header .ah-name{font:600 15px/1.2 Poppins,sans-serif;color:var(--os-navy)}
  .app-header .ah-score{font:600 12.5px/1.3 Poppins,sans-serif;color:var(--os-green-text)}
  .tabpanel{display:none;padding-bottom:84px}
  .tabpanel.is-active{display:block}
  .panel-section{padding:20px 16px}
  .panel-section + .panel-section{border-top:1px solid var(--os-tint-2)}

  @media (min-width:900px){
    .app-tabbar{top:0;bottom:0;left:0;right:auto;width:240px;height:100vh;max-width:none;margin:0;flex-direction:column;justify-content:flex-start;gap:4px;padding:28px 12px;border-top:0;border-right:1px solid var(--os-border);box-shadow:none}
    .app-tab{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:var(--r);font-size:13.5px}
    .app-tab.is-active{background:var(--os-tint-1)}
    .viewport{margin:24px auto 24px 264px !important}
    .tabpanel{padding-bottom:24px}
    body{background:var(--os-tint-2)}
  }
</style>
</head>
<body>
<div class="harness"><span>06 · APP SHELL — quatre destinations derrière une barre d'onglets, pas un long scroll (devient sidebar en desktop)</span><a href="index.html">← Jam</a></div>

<div id="app"></div>

<script src="../figma-profile/assets/fixture.js"></script>
<script src="../figma-profile/assets/sections.js"></script>
<script src="../figma-profile/assets/interactions.js"></script>
<script>
(function () {
  var S = window.OSSections, f = window.OS_FIXTURE, ICON = S.ICON;
  var v = f.ratings.verified;

  var header =
    '<div class="app-header">' +
      '<div class="logo-tile" style="background:rgba(44,149,255,.08)">' + f.business.logoInitials + "</div>" +
      '<div><div class="ah-name">' + S.esc(f.business.name) + '</div><div class="ah-score">' + ICON.check.replace("<svg ", '<svg width="11" height="11" style="vertical-align:-1px" ') + " " + v.rating.toFixed(1).replace(".", ",") + "/5 · " + v.count + " avis</div></div>" +
    "</div>";

  var panelApercu =
    '<div class="tabpanel is-active" id="panel-apercu">' +
      S.renderHeroPhoto() +
      '<div class="business-card" style="margin-top:-40px">' + S.renderBusinessIdentity(f) + '<div style="margin-top:16px">' + S.renderDashboard(f) + "</div></div>" +
      '<div class="panel-section">' + S.renderVerdict(f) + "</div>" +
      S.renderQualityApproach(f, { compact: false }) +
      '<div class="panel-section">' + S.renderCertificate(f) + "</div>" +
    "</div>";

  var panelAvis = '<div class="tabpanel" id="panel-avis">' + S.renderReviewTabsBlock(f, { showHighlights: true }) + "</div>";

  var panelAgences =
    '<div class="tabpanel" id="panel-agences"><div class="panel-section">' + S.renderLocations(f) + "</div></div>";

  var panelInfos =
    '<div class="tabpanel" id="panel-infos">' +
      '<div class="panel-section"><p class="section-title">Notre équipe</p></div>' +
      S.renderTeam(f) +
      '<div class="panel-section">' + S.renderFAQ(f) + "</div>" +
      '<div class="panel-section">' + S.renderListMyBusiness(f) + "</div>" +
      S.renderLegalBlock(f) +
      S.renderFooter(f) +
    "</div>";

  var tabbar =
    '<nav class="app-tabbar" aria-label="Navigation principale">' +
      '<button class="app-tab is-active" type="button" data-panel="panel-apercu">' + ICON.buildings + "<span>Aperçu</span></button>" +
      '<button class="app-tab" type="button" data-panel="panel-avis">' + ICON.check + "<span>Avis</span></button>" +
      '<button class="app-tab" type="button" data-panel="panel-agences">' + ICON.mapPinLg + "<span>Agences</span></button>" +
      '<button class="app-tab" type="button" data-panel="panel-infos">' + ICON.user + "<span>Infos</span></button>" +
    "</nav>";

  var html = S.renderBanner(f) + header + panelApercu + panelAvis + panelAgences + panelInfos + tabbar;

  var appEl = document.getElementById("app");
  appEl.innerHTML = '<div class="viewport">' + html + "</div>";
  OSInteractions.wireAll(appEl, f, { responsePlacement: "detail" });

  var tabs = appEl.querySelectorAll(".app-tab"), panels = appEl.querySelectorAll(".tabpanel");
  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      tabs.forEach(function (t) { t.classList.remove("is-active"); });
      tab.classList.add("is-active");
      panels.forEach(function (p) { p.classList.toggle("is-active", p.id === tab.getAttribute("data-panel")); });
      window.scrollTo(0, 0);
    });
  });
})();
</script>
</body>
</html>
