<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 — Explorateur d'avis · Opinion System</title>
<link rel="stylesheet" href="../../design-system/tokens.css">
<link rel="stylesheet" href="../A-7/assets/os-figma.css">
<link rel="stylesheet" href="../figma-profile/assets/profile.css">
<link rel="stylesheet" href="assets/jam.css">
<style>
  /* Radical mobile browsing: one review fills the screen at a time —
     swipe, or use the arrows — instead of an endless scroll of cards. */
  .mini-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--os-border)}
  .mini-head .logo-tile{width:40px;height:40px;border-radius:9px;font-size:14px}
  .mini-head .mh-name{font:600 15px/1.2 Poppins,sans-serif;color:var(--os-navy)}
  .mini-head .mh-score{font:400 12px/1.3 Poppins,sans-serif;color:var(--os-text-secondary)}
  .mini-head .mh-score strong{color:var(--os-green-text);font-weight:700}
  .mini-head .filter-btn{margin-left:auto;border:1px solid var(--os-border);background:var(--os-tint-1);border-radius:var(--r-pill);padding:8px 14px;font:600 13px/1.2 Poppins,sans-serif;color:var(--os-navy);cursor:pointer;display:flex;align-items:center;gap:6px}
  .deck-track{display:flex;transition:transform .32s cubic-bezier(.32,.72,0,1)}
  .deck-slide{flex:0 0 100%;min-width:0;padding:0 16px}
  .deck-slide .review-card{min-height:340px}
  .explorer-empty{padding:60px 24px;text-align:center;color:var(--os-text-secondary);font:500 14px/1.5 Poppins,sans-serif}
  .rest{margin-top:12px}
</style>
</head>
<body>
<div class="harness"><span>03 · EXPLORATEUR D'AVIS — un avis plein écran à la fois, swipe/flèches, tout le reste replié en dessous</span><a href="index.html">← Jam</a></div>

<div id="app"></div>

<div class="sheet-scrim" id="scrim"></div>
<div class="sheet" id="filterSheet" role="dialog" aria-modal="true" aria-label="Filtrer et trier">
  <div class="sheet-handle"></div>
  <div class="sheet-head"><span class="t-sub1 strong">Filtrer &amp; trier</span><button class="sheet-close" data-close-sheet aria-label="Fermer">✕</button></div>
  <div class="sheet-body">
    <div class="section stack-8">
      <p class="t-sub2" style="margin:0">Thème</p>
      <div class="filter-scroller" id="filter-row" style="padding:0"></div>
    </div>
    <div class="section stack-8">
      <div class="sort-row"><label for="sort-select">Trier</label>
      <select class="sort-select" id="sort-select"><option value="recent">Les plus récents</option><option value="highest">Mieux notés</option><option value="lowest">Moins bien notés</option></select></div>
    </div>
    <div class="section"><button class="btn btn-cta btn-block" type="button" data-close-sheet>Voir les résultats</button></div>
  </div>
</div>

<script src="../figma-profile/assets/fixture.js"></script>
<script src="../figma-profile/assets/sections.js"></script>
<script src="../figma-profile/assets/interactions.js"></script>
<script>
(function () {
  var S = window.OSSections, f = window.OS_FIXTURE, ICON = S.ICON;
  var v = f.ratings.verified;
  var state = { filter: "Tous", sort: "recent", index: 0 };

  var restHtml =
    '<div class="rest">' +
      '<details class="acc"><summary>Nos agences</summary><div class="acc-body">' + S.renderLocations(f) + "</div></details>" +
      '<details class="acc"><summary>Démarche qualité</summary><div class="acc-body">' + S.renderQualityApproach(f, { compact: true }) + "</div></details>" +
      '<details class="acc"><summary>Notre équipe</summary><div class="acc-body" style="padding:12px 0">' + S.renderTeam(f) + "</div></details>" +
      '<details class="acc"><summary>Certificat</summary><div class="acc-body">' + S.renderCertificate(f) + "</div></details>" +
      '<details class="acc"><summary>Questions fréquentes</summary><div class="acc-body">' + S.renderFAQ(f) + "</div></details>" +
      '<div class="section">' + S.renderListMyBusiness(f) + "</div>" +
      S.renderLegalBlock(f) +
      S.renderFooter(f) +
    "</div>";

  var shell =
    S.renderBanner(f) +
    '<div class="mini-head">' +
      '<div class="logo-tile" style="background:rgba(44,149,255,.08)">' + f.business.logoInitials + "</div>" +
      '<div><div class="mh-name">' + S.esc(f.business.name) + '</div><div class="mh-score">' + ICON.check.replace("<svg ", '<svg width="11" height="11" style="vertical-align:-1px" ') + " <strong>" + v.rating.toFixed(1).replace(".", ",") + "/5</strong> · " + v.count + " avis contrôlés</div></div>" +
      '<button class="filter-btn" type="button" id="openFilterSheet">Filtrer<svg viewBox="0 0 24 24" width="14" height="14" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>' +
    "</div>" +
    '<div class="deck-progress" id="progress"></div>' +
    '<div class="deck-nav" style="padding-top:0"><span class="deck-counter" id="counter"></span></div>' +
    '<div class="deck" id="deck"><div class="deck-card-wrap"><div class="deck-track" id="track"></div></div></div>' +
    '<div class="deck-nav">' +
      '<button type="button" id="prevBtn" aria-label="Avis précédent"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      '<span class="t-caption muted">Glissez, ou utilisez les flèches</span>' +
      '<button type="button" id="nextBtn" aria-label="Avis suivant"><svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
    "</div>" +
    restHtml;

  var appEl = document.getElementById("app");
  appEl.innerHTML = '<div class="viewport">' + shell + "</div>";

  function filtered() {
    var arr = f.reviews.verified.slice();
    if (state.filter !== "Tous") arr = arr.filter(function (r) { return r.topics.indexOf(state.filter) !== -1; });
    if (state.sort === "highest") arr.sort(function (a, b) { return b.rating - a.rating; });
    else if (state.sort === "lowest") arr.sort(function (a, b) { return a.rating - b.rating; });
    return arr;
  }

  function wireCard(card) {
    var textBtn = card.querySelector('[data-action="toggle-text"]');
    if (textBtn) textBtn.addEventListener("click", function () {
      var body = card.querySelector(".review-body");
      var expanded = body.classList.toggle("is-clamped") === false;
      textBtn.setAttribute("aria-expanded", String(expanded));
      textBtn.childNodes[0].nodeValue = expanded ? "Voir moins " : "Voir plus ";
    });
    var detailBtn = card.querySelector('[data-action="toggle-detail"]');
    if (detailBtn) detailBtn.addEventListener("click", function () {
      var detail = card.querySelector(".review-detail");
      var willOpen = detail.hidden;
      detail.hidden = !willOpen;
      detailBtn.setAttribute("aria-expanded", String(willOpen));
      detailBtn.childNodes[0].nodeValue = willOpen ? "Masquer le détail complet " : "Voir le détail complet ";
    });
    card.querySelectorAll('[data-action="helpful"],[data-action="report"]').forEach(function (b) {
      b.addEventListener("click", function () { b.disabled = true; b.style.opacity = ".6"; });
    });
  }

  var track = document.getElementById("track"), progress = document.getElementById("progress"),
      counter = document.getElementById("counter"), prevBtn = document.getElementById("prevBtn"), nextBtn = document.getElementById("nextBtn");

  function render() {
    var list = filtered();
    if (state.index >= list.length) state.index = Math.max(0, list.length - 1);
    if (!list.length) {
      track.innerHTML = '<div class="deck-slide"><div class="explorer-empty">Aucun avis ne correspond à ce filtre.</div></div>';
      progress.innerHTML = ""; counter.textContent = "0 / 0";
      prevBtn.disabled = nextBtn.disabled = true;
      return;
    }
    track.innerHTML = list.map(function (r) { return '<div class="deck-slide">' + S.renderVerifiedCard(r, { responsePlacement: "detail" }) + "</div>"; }).join("");
    track.querySelectorAll(".review-card").forEach(wireCard);
    progress.innerHTML = list.map(function (_, i) { return '<i class="' + (i <= state.index ? "is-seen" : "") + '"></i>'; }).join("");
    counter.textContent = (state.index + 1) + " / " + list.length;
    track.style.transform = "translateX(-" + (state.index * 100) + "%)";
    prevBtn.disabled = state.index === 0;
    nextBtn.disabled = state.index === list.length - 1;
  }

  prevBtn.addEventListener("click", function () { if (state.index > 0) { state.index--; render(); } });
  nextBtn.addEventListener("click", function () { state.index++; render(); });

  // Touch swipe
  var deckWrap = document.querySelector(".deck-card-wrap"), startX = null;
  deckWrap.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; }, { passive: true });
  deckWrap.addEventListener("touchend", function (e) {
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    if (dx < -50) nextBtn.click(); else if (dx > 50) prevBtn.click();
    startX = null;
  });

  // Filter sheet
  var filterRowEl = document.getElementById("filter-row"), sortEl = document.getElementById("sort-select");
  function renderFilterRow() {
    var topics = ["Tous"].concat(f.filterTaxonomy);
    filterRowEl.innerHTML = topics.map(function (t) {
      return '<button class="chip' + (t === state.filter ? " chip-selected" : " chip-outlined") + '" type="button" data-topic="' + S.esc(t) + '">' + S.esc(t) + "</button>";
    }).join("");
    filterRowEl.querySelectorAll("[data-topic]").forEach(function (btn) {
      btn.addEventListener("click", function () { state.filter = btn.getAttribute("data-topic"); state.index = 0; renderFilterRow(); render(); });
    });
  }
  sortEl.addEventListener("change", function (e) { state.sort = e.target.value; state.index = 0; render(); });
  renderFilterRow();
  render();

  var scrim = document.getElementById("scrim"), filterSheet = document.getElementById("filterSheet");
  document.getElementById("openFilterSheet").addEventListener("click", function () { filterSheet.classList.add("is-open"); scrim.classList.add("is-open"); document.body.style.overflow = "hidden"; });
  function closeSheet() { filterSheet.classList.remove("is-open"); scrim.classList.remove("is-open"); document.body.style.overflow = ""; }
  document.querySelectorAll("[data-close-sheet]").forEach(function (b) { b.addEventListener("click", closeSheet); });
  scrim.addEventListener("click", closeSheet);

  // FAQ + hours accordions inside "rest" reuse the same data-action names
  appEl.querySelectorAll('[data-action="toggle-faq"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      var answer = document.getElementById(btn.getAttribute("aria-controls"));
      var willOpen = answer.hidden;
      answer.hidden = !willOpen;
      btn.setAttribute("aria-expanded", String(willOpen));
      btn.querySelector(".faq-icon").textContent = willOpen ? "−" : "+";
    });
  });
  appEl.querySelectorAll('[data-action="toggle-hours"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      var hours = btn.closest(".agency-card").querySelector(".agency-hours");
      if (!hours) return;
      var willOpen = hours.hidden;
      hours.hidden = !willOpen;
      btn.setAttribute("aria-expanded", String(willOpen));
    });
  });
})();
</script>
</body>
</html>
