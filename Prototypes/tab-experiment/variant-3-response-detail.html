<div class="harness"><span>VARIANTE 3 — RÉPONSE DANS LE DÉTAIL — Q9-B · fonctionnellement identique au Contrôle sur cette variable (voir note)</span><a href="index.html">← Comparatif</a></div>
<div id="app"></div>
<script src="assets/fixture.js"></script>
<script src="assets/render.js"></script>
<script>
  /* Control's own default for response placement is already "detail" — see
     the note in launcher.html's comparison table. This file exists to give
     the "detail-only" hypothesis its own explicit, labeled slot in the
     comparison launcher next to Variant 2's "always visible" hypothesis,
     per the approved variant plan (Q9-A vs Q9-B). */
  OSExperiment.mount(document.getElementById("app"), window.OS_FIXTURE, {
    variantId: "response-detail",
    variantLabel: "Réponse dans le détail",
    responsePlacement: "detail",
    filterMode: "legacyMixed"      /* identical to Control */
  });
</script>
